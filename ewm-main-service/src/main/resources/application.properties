# Server configuration
server.port=8080
spring.application.name=ewm-main-service

# Database configuration for the main service
spring.datasource.url=jdbc:postgresql://localhost:5432/ewm_main
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Integration with the statistics service
stats-server.url=http://localhost:9090

# Jackson formatting for date and time consistency
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC